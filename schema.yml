      description: |-
        * `draft` - Draft
        * `pending_approval` - Pending Approval
        * `approved` - Approved (Ready for Disbursal)
        * `rejected` - Rejected
        * `active` - Active
        * `repaid` - Repaid
        * `defaulted` - Defaulted
        * `extended` - Extended
        * `foreclosed` - Foreclosed
    TokenRefresh:
      type: object
      properties:
        access:
          type: string
          readOnly: true
        refresh:
          type: string
      required:
      - access
      - refresh
    TokenRefreshRequest:
      type: object
      properties:
        refresh:
          type: string
          minLength: 1
      required:
      - refresh
    TokenVerifyRequest:
      type: object
      properties:
        token:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - token
    UserProfile:
      type: object
      description: Detailed user profile serializer for authenticated sessions
      properties:
        id:
          type: integer
          readOnly: true
        username:
          type: string
          readOnly: true
          description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_
            only.
        email:
          type: string
          format: email
          readOnly: true
          title: Email address
        first_name:
          type: string
          readOnly: true
        last_name:
          type: string
          readOnly: true
        full_name:
          type: string
          readOnly: true
        phone:
          type: string
          readOnly: true
        role:
          allOf:
          - $ref: '#/components/schemas/Role'
          readOnly: true
        branch:
          allOf:
          - $ref: '#/components/schemas/BranchBasic'
          readOnly: true
        organization:
          allOf:
          - $ref: '#/components/schemas/OrganizationBasic'
          readOnly: true
        is_active:
          type: boolean
          readOnly: true
        is_staff:
          type: boolean
          readOnly: true
          title: Staff status
          description: Designates whether the user can log into this admin site.
        is_superuser:
          type: boolean
          readOnly: true
          title: Superuser status
          description: Designates that this user has all permissions without explicitly
            assigning them.
        is_organization_admin:
          type: boolean
          readOnly: true
          description: Whether user is an admin for their organization
        is_pawnshop_admin:
          type: boolean
          readOnly: true
          description: Whether user is a pawnshop admin (only admin can manage staff)
        is_branch_manager:
          type: string
          readOnly: true
        is_regional_manager:
          type: string
          readOnly: true
        permissions:
          type: string
          readOnly: true
        date_joined:
          type: string
          format: date-time
          readOnly: true
        last_login:
          type: string
          format: date-time
          readOnly: true
      required:
      - branch
      - date_joined
      - email
      - first_name
      - full_name
      - id
      - is_active
      - is_branch_manager
      - is_organization_admin
      - is_pawnshop_admin
      - is_regional_manager
      - is_staff
      - is_superuser
      - last_login
      - last_name
      - organization
      - permissions
      - phone
      - role
      - username
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    tokenAuth:
      type: apiKey
      in: header
      name: Authorization
      description: Token-based authentication with required prefix "Token"
