      properties:
        id:
          type: integer
          readOnly: true
        loan:
          type: integer
        loan_number:
          type: string
          readOnly: true
        customer_name:
          type: string
          readOnly: true
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        payment_date:
          type: string
          format: date
