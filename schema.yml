      properties:
        id:
          type: integer
        loan_number:
          type: string
        customer_name:
          type: string
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        payment_method:
          type: string
        payment_date:
          type: string
          format: date
        reference_number:
