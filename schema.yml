      - created_at
      - customer
      - customer_name
      - customer_phone
      - due_date
      - id
      - is_overdue
      - issue_date
      - items_count
      - loan_number
      - principal_amount
      - remaining_balance
      - total_gross_weight
      - total_net_weight
    OrganizationBasic:
