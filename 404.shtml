<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found | Pawnshop ERP</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f8fafc;
            color: #334155;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            text-align: center;
            background: #ffffff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            max-width: 480px;
            width: 90%;
        }
        h1 { font-size: 48px; margin: 0 0 10px; color: #dc2626; }
        h2 { font-size: 20px; margin: 0 0 15px; color: #1e293b; }
        p { font-size: 14px; color: #64748b; margin-bottom: 25px; line-height: 1.5; }
        a {
            display: inline-block;
            background-color: #0d6efd;
            color: #ffffff;
            text-decoration: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 500;
        }
        a:hover { background-color: #0b5ed7; }
    </style>
</head>
<body>
    <div class="container">
        <h1>404</h1>
        <h2>Resource Not Found</h2>
        <p>The page or file you are looking for does not exist on this server.</p>
        <a href="/">Return to Dashboard</a>
    </div>
</body>
</html>
