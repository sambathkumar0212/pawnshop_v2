services:
  # Web service
  - type: web
    name: pawnshop
    env: docker
    dockerfilePath: ./Dockerfile
    plan: free
    autoDeploy: true
    envVars:
      - key: RENDER
        value: true
      - key: CHROME_BIN
        value: /usr/bin/chromium
      - key: CHROMIUM_PATH
        value: /usr/bin/chromium
      - key: PLAYWRIGHT_BROWSERS_PATH
        value: "0"
      - key: DJANGO_SETTINGS_MODULE
        value: pawnshop_management.settings
      - key: DJANGO_ENV
        value: production
      - key: DEBUG
        value: false
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: DJANGO_SUPERUSER_USERNAME
        value: admin
      - key: DJANGO_SUPERUSER_EMAIL
        value: admin@firstmoneygold.com
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false
